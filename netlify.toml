[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/sitemap-products.xml"
  to = "/sitemap-products.xml"
  status = 200

[[redirects]]
  from = "/sitemap-categories.xml"
  to = "/sitemap-categories.xml"
  status = 200

[[redirects]]
  from = "/sitemap-collections.xml"
  to = "/sitemap-collections.xml"
  status = 200

[[redirects]]
  from = "/sitemap-blog.xml"
  to = "/sitemap-blog.xml"
  status = 200

[[redirects]]
  from = "/sitemap-pages.xml"
  to = "/sitemap-pages.xml"
  status = 200

[[redirects]]
  from = "/image-sitemap.xml"
  to = "/image-sitemap.xml"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
